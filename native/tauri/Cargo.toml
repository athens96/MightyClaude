[workspace]
members = ["crates/mighty-core", "crates/mighty-composer", "crates/mighty-graph", "crates/mighty-platform", "crates/mighty-platform-windows", "crates/mighty-platform-macos", "crates/mighty-run", "crates/mighty-history", "crates/mighty-workmap", "src-tauri"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
# Let chains (`if let … && let …`) need 1.88.
rust-version = "1.88"

[workspace.dependencies]
mighty-core = { path = "crates/mighty-core" }
mighty-composer = { path = "crates/mighty-composer" }
mighty-graph = { path = "crates/mighty-graph" }
mighty-run = { path = "crates/mighty-run" }
mighty-history = { path = "crates/mighty-history" }
mighty-workmap = { path = "crates/mighty-workmap" }
serde = { version = "1", features = ["derive"] }
# preserve_order: objects keep the order they were read in (C#'s readers and writers see document order); float_roundtrip:
# every double reads as the closest one, as .NET's parser reads it; raw_value: the host emits the JSON text it wrote as it is.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "raw_value"] }
indexmap = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
dirs = "6"
unicode-segmentation = "1"
sys-locale = "0.3"
mighty-platform = { path = "crates/mighty-platform" }
mighty-platform-windows = { path = "crates/mighty-platform-windows" }
mighty-platform-macos = { path = "crates/mighty-platform-macos" }
tokio = "1"
tauri = "2"
sha2 = "0.10"
regex = "1"
percent-encoding = "2"
