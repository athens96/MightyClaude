[package]
name = "mighty-files"
version = "0.1.0"
description = "Mighty Code's files pane, previews and changes (the Rust side of MightyCode.Core's WorkspaceFiles, FileDiff, FilePatch, FileChanges, ReferencePreview and SourceFind, and of the WinUI host's files-pane, picture and HTML-frame models): the tree, the preview the page draws, the 변경사항 diff against a run's originals or git's HEAD. No Tauri; the OS only through mighty-platform's ports."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
mighty-core.workspace = true
mighty-composer.workspace = true
mighty-graph.workspace = true
mighty-platform.workspace = true
serde_json.workspace = true
chrono.workspace = true
sha2.workspace = true
regex.workspace = true
percent-encoding.workspace = true
uuid.workspace = true
base64 = "0.22"
tokio = { workspace = true, features = ["io-util", "time", "macros"] }
# SVG drawn to PNG (C# NativeSvgRaster, Win2D's CanvasSvgDocument): the safe, canonical document only.
resvg = "0.50"
# Pictures the page cannot draw as they are, or too large to send whole, decoded and fitted to a PNG (C# BitmapDecoder/BitmapEncoder).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "time", "macros", "rt", "rt-multi-thread"] }
# The checks write CP949 text (C# Encoding.GetEncoding(949)) and drive the run engine's parser with the originals' hook.
encoding_rs = "0.8"
mighty-run.workspace = true

[target.'cfg(windows)'.dev-dependencies]
mighty-platform-windows.workspace = true
