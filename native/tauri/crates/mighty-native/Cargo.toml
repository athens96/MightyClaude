[package]
name = "mighty-native"
version = "0.1.0"
description = "Mighty Code's native forms (W6): a virtual WinUI of the controls the C# settings builders use, the port of C# WebNativeReader that reads them into the page's NativeNode JSON, the settings kit, and the settings, setup, dialog and companion surfaces. No Tauri, no OS code."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
mighty-core.workspace = true
serde_json.workspace = true
indexmap.workspace = true

# W6 Step 0 lists the dependencies before any code uses them; this table goes once the crate's code does.
[lints.cargo]
unused_dependencies = "allow"
