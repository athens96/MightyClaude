[package]
name = "mighty-accounts"
version = "0.1.0"
description = "Mighty Code's CLI accounts, login recovery and account usage (W6-C: C# CliAccounts, CliAccountStrings, CliLoginRecovery, BedrockSettings, AccountUsage, AccountUsagePresentation, AccountUsageReset, AccountUsageRuntime, AccountUsageStrings), with no Tauri dependency and no OS code."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# The checks' stand-in CLI (`auth status`, logout, the Codex app-server, `agy -p /usage`), relaunched by the tests as mighty-run's
# `mighty-fake-cli` is: std and serde_json only, so it builds on every OS. Not tests/fake/main.rs: Cargo would also take that as a
# test target.
[[bin]]
name = "mighty-accounts-fake"
path = "tests/fake/cli.rs"
test = false
doc = false

[dependencies]
mighty-core.workspace = true
mighty-native.workspace = true
mighty-platform.workspace = true
mighty-run.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
regex.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "macros", "io-util"] }
url = "2"
base64 = "0.22"
# W6 Step 0 listed it for every part; nothing here hashes yet.
sha2.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "time", "rt", "rt-multi-thread", "macros", "io-util"] }

[target.'cfg(windows)'.dev-dependencies]
mighty-platform-windows.workspace = true

[lints.cargo]
unused_dependencies = "allow"
