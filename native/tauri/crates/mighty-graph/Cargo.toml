[package]
name = "mighty-graph"
version = "0.1.0"
description = "Mighty Code's execution graph: the tracker that turns a run's stream into graph blocks, the Mighty views' rules (diagram, role view, timeline, structure) and the host's `mighty` push model. Pure logic: no OS, no Tauri."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# mighty-run's stand-in agent CLI (its tests/fake/cli.rs, std and serde_json only), built here too so this crate's tests can run real
# ACP runs through the run engine with the real tracker (tests/acp_graphs.rs): a `[[bin]]` is only named by its own package's tests.
[[bin]]
name = "mighty-graph-fake-cli"
path = "../mighty-run/tests/fake/cli.rs"
test = false
doc = false

[dependencies]
mighty-core.workspace = true
# The run engine's graph seam (`run.rs`): mighty-run never reads this crate, so the two have no cycle.
mighty-run.workspace = true
serde.workspace = true
serde_json.workspace = true
indexmap = { workspace = true, features = ["serde"] }
unicode-segmentation.workspace = true
sha2.workspace = true
regex.workspace = true
percent-encoding.workspace = true
chrono.workspace = true

[dev-dependencies]
mighty-platform.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "rt-multi-thread", "macros"] }

[target.'cfg(windows)'.dev-dependencies]
mighty-platform-windows.workspace = true
