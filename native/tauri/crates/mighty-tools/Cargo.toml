[package]
name = "mighty-tools"
version = "0.1.0"
description = "Mighty Code's setup screen, components, toolkit and status line (W6-B: C# SetupCatalog, SetupPlan, SetupProbe, ComponentSection, ToolkitFileReader, ToolkitStore, ToolkitProbe, ToolkitRunner, StatusLine, StatusLineRefresher, StatusLineTrust), with no Tauri dependency and no OS code."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# The checks' stand-in CLI (the commands setup, the toolkit and the status line run), relaunched by the tests as mighty-run's
# `mighty-fake-cli` is: std only, so it builds on every OS. Not tests/fake/main.rs: Cargo would also take that as a test target.
[[bin]]
name = "mighty-tools-fake"
path = "tests/fake/cli.rs"
test = false
doc = false

[dependencies]
mighty-core.workspace = true
mighty-platform.workspace = true
# RuntimeInfo, ProviderRuntime, SupportsMods, CliDiscovery.VersionText and the process language (`strings`, C# `Locale.Get`).
mighty-run.workspace = true
# The status line card's input (`StatusLineInput`, `StatusRun`), which `status_line::input` fills.
mighty-composer.workspace = true
serde_json.workspace = true
indexmap.workspace = true
chrono.workspace = true
regex.workspace = true
sha2.workspace = true
uuid.workspace = true
url = "2"
tokio = { workspace = true, features = ["sync", "time", "rt", "macros", "io-util"] }

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "time", "rt", "rt-multi-thread", "macros", "io-util"] }

# The checks that run the stand-in through Windows' own ProcessHost and the setup folder's ACLs.
[target.'cfg(windows)'.dev-dependencies]
mighty-platform-windows.workspace = true
