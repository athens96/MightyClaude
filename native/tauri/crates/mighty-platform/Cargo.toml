[package]
name = "mighty-platform"
version = "0.1.0"
description = "The ports between Mighty Code's shared logic and the operating system (traits, PlatformProfile) with a fake of each for tests. No OS code."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
tokio = { workspace = true, features = ["sync", "io-util", "time", "macros"] }

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "io-util", "time", "rt", "macros"] }
