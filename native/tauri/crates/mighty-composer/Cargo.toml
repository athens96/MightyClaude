[package]
name = "mighty-composer"
version = "0.1.0"
description = "Mighty Code's composer and cards: slash commands, next actions, the queue, pending display, pictures and attachments, and the composer state and cards the page draws (the Rust side of MightyCode.Core's composer classes and the WinUI host's composer and card builders). No Tauri, no OS-specific code."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
mighty-core.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
sha2 = "0.10"
base64 = "0.22"
encoding_rs = "0.8"
quick-xml = "0.38"
percent-encoding = "2"
regex = "1"
