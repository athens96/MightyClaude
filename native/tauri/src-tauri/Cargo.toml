[package]
name = "mightycode"
# The app's version (VERSION at the repository root); scripts/release.py does not bump it yet.
version = "0.4.59"
description = "Mighty Code (Rust + Tauri 2 host, skeleton)"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# The 0.4.x updater replaces MightyCode.exe: the binary keeps that name.
[[bin]]
name = "MightyCode"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mighty-core.workspace = true
mighty-composer.workspace = true
mighty-files.workspace = true
mighty-graph.workspace = true
mighty-platform.workspace = true
mighty-run.workspace = true
mighty-terminal.workspace = true
indexmap.workspace = true
base64 = "0.22"
# pickAttachments: the OS's file picker (C# FileOpenPicker), Rust-side only (no page permission).
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
sys-locale.workspace = true
# unstable: child webviews of the main window (the browser panes' native views, src/surface.rs).
tauri = { workspace = true, features = ["unstable"] }
tokio = { workspace = true, features = ["sync", "io-util", "time", "macros"] }

# The OS's implementation of the ports: chosen here and in src/platform.rs, nowhere else.
[target.'cfg(windows)'.dependencies]
mighty-platform-windows.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
mighty-platform-macos.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "rt", "macros"] }
