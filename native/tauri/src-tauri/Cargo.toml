[package]
name = "mightycode"
# The app's version (VERSION at the repository root); scripts/release.py does not bump it yet.
version = "0.4.59"
description = "Mighty Code (Rust + Tauri 2 host, skeleton)"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# The 0.4.x updater replaces MightyCode.exe: the binary keeps that name.
[[bin]]
name = "MightyCode"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mighty-core.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
sys-locale.workspace = true
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["sync"] }
