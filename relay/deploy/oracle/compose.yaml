name: mightyclaude-relay

# The relay from relay/Dockerfile behind Caddy, which gets a Let's Encrypt
# certificate for RELAY_DOMAIN on its own over ports 80/443. Both images are
# built or pulled for the server's own CPU, so an Ampere (arm64) and an AMD
# micro instance work alike.
#
# coturn provides TURN relay on UDP/TCP 3478. The relay mints short-lived HMAC
# credentials (use-auth-secret); the secret lives only here, never on clients.
services:
  relay:
    build:
      context: ../..
    restart: unless-stopped
    environment:
      PORT: "8787"
      HOST: "0.0.0.0"
      # Only Caddy reaches the relay (no published port), and Caddy sets the
      # last X-Forwarded-For hop to the address it saw, so per-IP limits key on
      # the real client instead of the proxy.
      RELAY_TRUST_PROXY: "1"
      TURN_SECRET: "${TURN_SECRET:?set TURN_SECRET in .env}"
      TURN_HOST: "${RELAY_DOMAIN:?set RELAY_DOMAIN in .env}"
      TURN_PORT: "3478"
      TURN_CREDENTIAL_TTL_SECS: "3600"
      TURN_RATE_WINDOW_MS: "600000"
      TURN_MAX_PER_SERVER_ID: "5"
      TURN_MAX_PER_IP: "10"
      TURN_MAX_GLOBAL: "60"
      # Push (docs/relay.md "푸시 알림"): handles survive redeploys on relay_data;
      # without the key file sending answers 503 and everything else still works.
      PUSH_STORE_PATH: "/data/push-handles.json"
      FCM_SERVICE_ACCOUNT_FILE: "/run/mighty-secrets/fcm-service-account.json"
      PUSH_RATE_WINDOW_MS: "600000"
      PUSH_MAX_SEND_PER_SERVER_ID: "120"
      PUSH_MAX_SEND_PER_IP: "240"
      PUSH_MAX_SEND_GLOBAL: "3000"
      PUSH_MAX_HANDLE_OPS_PER_IP: "30"
      PUSH_MAX_REGISTRATIONS_GLOBAL: "300"
    volumes:
      - relay_data:/data
      # setup.sh makes this folder (owner uid 1000 = the image's node user, mode 500).
      - ./secrets:/run/mighty-secrets:ro

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      RELAY_DOMAIN: "${RELAY_DOMAIN:?set RELAY_DOMAIN in .env}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - relay

  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - /etc/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]

volumes:
  relay_data:
  caddy_data:
  caddy_config:
