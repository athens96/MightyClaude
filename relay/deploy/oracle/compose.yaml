name: mightyclaude-relay

# The relay from relay/Dockerfile behind Caddy, which gets a Let's Encrypt
# certificate for RELAY_DOMAIN on its own over ports 80/443. Both images are
# built or pulled for the server's own CPU, so an Ampere (arm64) and an AMD
# micro instance work alike.
services:
  relay:
    build:
      context: ../..
    restart: unless-stopped
    environment:
      PORT: "8787"
      HOST: "0.0.0.0"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      RELAY_DOMAIN: "${RELAY_DOMAIN:?set RELAY_DOMAIN in .env}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - relay

volumes:
  caddy_data:
  caddy_config:
