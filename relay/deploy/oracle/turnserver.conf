# coturn configuration for Mighty Claude relay
# use-auth-secret: the relay mints short-lived HMAC credentials.
# The secret is loaded from the TURN_SECRET environment variable at startup.

use-auth-secret
static-auth-secret=${TURN_SECRET}

# Listening port. No TLS listener: there is no certificate for coturn, and the
# media is DTLS-SRTP end to end anyway.
listening-port=3478

# External IP for Oracle Cloud NAT (public IP / private IP).
# The setup.sh substitutes the actual values at deploy time.
external-ip=${EXTERNAL_IP}/${INTERNAL_IP}

# Realm
realm=mightyclaude.duckdns.org

# Relay media port range. Pinned (instead of coturn's 49152-65535 default) so the
# host firewall and the Oracle security list only have to open these 41 ports.
# One allocation uses one port; the feature allows 1 controller + 2 view-only phones.
min-port=49160
max-port=49200


# No-auth is NOT set — REST API (use-auth-secret) is the only auth method.

# Deny relaying to private / link-local / metadata IP ranges.
# Prevents TURN being used to reach internal infrastructure.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=224.0.0.0-239.255.255.255
# Oracle instance metadata service
denied-peer-ip=169.254.169.254-169.254.169.254
# IPv6: loopback, unique-local (fc00::/7), link-local (fe80::/10),
# IPv4-mapped (::ffff:0:0/96) and NAT64 (64:ff9b::/96) — the last two would
# otherwise reach the IPv4 ranges above through an IPv6 spelling.
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
no-multicast-peers

# No telnet admin console.
no-cli

# Bandwidth quotas. coturn counts max-bps and bps-capacity in BYTES per second:
#   max-bps=250000      -> 2 Mbps per session (sender caps to this on relayed paths)
#   bps-capacity=1000000 -> 8 Mbps across all sessions
# user-quota / total-quota are session counts.
user-quota=4
total-quota=8
max-bps=250000
bps-capacity=1000000

# Logging (default level; verbose would log every allocation).
log-file=/var/log/coturn/turn.log

# Fingerprint in TURN messages for NAT traversal compatibility.
fingerprint

# Avoid DNS PTR lookups on client IPs.
no-rfc5780
no-stun-backward-compatibility
