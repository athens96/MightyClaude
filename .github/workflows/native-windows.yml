name: Native clients — Windows
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    name: Windows ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-2025
          - architecture: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Locale gate — missing keys and touched-file Korean check
        shell: pwsh
        run: |
          $sha = (Get-Content scripts/locale-touched-baseline).Trim()
          node scripts/check-locales.js --check --touched-since $sha
      - name: Design-token gate — colour literals only go down
        shell: pwsh
        run: node scripts/check-design-tokens.js --check
      - name: Test core and publish self-contained WinUI folder and ZIP
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Architecture ${{ matrix.architecture }} -Configuration Release
      - name: Launch native WinUI with an isolated profile and capture GUI evidence
        shell: pwsh
        timeout-minutes: 4
        run: ./scripts/test-native-windows.ps1 -Executable ./release/native-windows-${{ matrix.architecture }}/MightyClaude.exe -ProfileDirectory "$env:RUNNER_TEMP/mighty-windows-smoke-${{ matrix.architecture }}"
      - name: Upload distributable
        uses: actions/upload-artifact@v4
        with:
          name: MightyClaude-native-windows-${{ matrix.architecture }}
          path: |
            release/MightyClaude-windows-${{ matrix.architecture }}.zip
            release/MightyClaude-windows-${{ matrix.architecture }}.zip.sha256
          if-no-files-found: error
      - name: Upload isolated GUI result and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MightyClaude-windows-${{ matrix.architecture }}-smoke
          # WebView2 can still retire cache files after a failed app exits.
          # Publish the durable evidence only, not its mutable browser profile.
          path: |
            ${{ runner.temp }}/mighty-windows-smoke-${{ matrix.architecture }}/smoke*.png
            ${{ runner.temp }}/mighty-windows-smoke-${{ matrix.architecture }}/smoke-result.json
            ${{ runner.temp }}/mighty-windows-smoke-${{ matrix.architecture }}/*.log
            ${{ runner.temp }}/mighty-windows-smoke-${{ matrix.architecture }}/native-crash-events*.json
            ${{ runner.temp }}/mighty-windows-smoke-${{ matrix.architecture }}/native-crash-events-error.txt
            ${{ runner.temp }}/mighty-windows-smoke-${{ matrix.architecture }}/native-process.json
            ${{ runner.temp }}/mighty-windows-smoke-${{ matrix.architecture }}/published-files.json
          if-no-files-found: warn
