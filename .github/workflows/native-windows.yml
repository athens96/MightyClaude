name: Native clients — Windows
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    name: Windows ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-2025
          - architecture: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: native/windows/web/package-lock.json
      - name: Web UI — install, typecheck and unit tests
        shell: pwsh
        # The window is this page (native/windows/web); the .NET build below runs its npm run build into Assets/Web.
        working-directory: native/windows/web
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw 'web typecheck failed' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'web unit tests failed' }
      - name: Locale gate — missing keys and touched-file Korean check
        shell: pwsh
        run: |
          $sha = (Get-Content scripts/locale-touched-baseline).Trim()
          node scripts/check-locales.js --check --touched-since $sha
      - name: Design-token gate — colour and spacing literals only go down
        shell: pwsh
        run: node scripts/check-design-tokens.js --check
      - name: Install Inno Setup 6 for the setup program
        shell: pwsh
        # Always the pinned release, checked by its SHA-256 before it runs, never whatever Inno Setup the runner image carries.
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe -OutFile $setup
          if ((Get-FileHash $setup -Algorithm SHA256).Hash -ne '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732') { throw 'Inno Setup download does not match its pinned SHA-256' }
          $dir = Join-Path $env:RUNNER_TEMP 'innosetup'
          $process = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=`"$dir`"" -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Test-Path "$dir/ISCC.exe")) { throw "Inno Setup install failed ($($process.ExitCode))" }
          "MIGHTY_ISCC=$dir/ISCC.exe" >> $env:GITHUB_ENV
      - name: Test core and publish self-contained WinUI folder, ZIP and setup program
        shell: pwsh
        # The update address and the public half of the update signing key, as the Mac release
        # build stamps them; the signing key itself never leaves the release machine.
        env:
          MIGHTY_UPDATE_URL: https://pub-fd035e0a9ad7411f8d8d8963cc2b9702.r2.dev/mightyclaude/latest.json
          MIGHTY_UPDATE_PUBLIC_KEY: ZGxMTGfVVu2ocgC6ajyqDBl4JqPmyzlqK/xgGMDsa2c=
        run: ./scripts/build-windows.ps1 -Architecture ${{ matrix.architecture }} -Configuration Release -Installer
      - name: Launch native WinUI with an isolated profile and capture GUI evidence
        shell: pwsh
        timeout-minutes: 6
        run: ./scripts/test-native-windows.ps1 -Executable ./release/native-windows-${{ matrix.architecture }}/MightyClaude.exe -ProfileDirectory "$env:RUNNER_TEMP/mighty-windows-smoke-${{ matrix.architecture }}"
      - name: Launch the web shell with an isolated profile and check its smoke
        shell: pwsh
        timeout-minutes: 6
        run: ./scripts/test-native-windows.ps1 -Web -Executable ./release/native-windows-${{ matrix.architecture }}/MightyClaude.exe -ProfileDirectory "$env:RUNNER_TEMP/mighty-windows-web-smoke-${{ matrix.architecture }}"
      - name: Install the setup program for this user, check it, and uninstall it
        shell: pwsh
        timeout-minutes: 6
        run: ./scripts/test-windows-installer.ps1 -Setup ./release/MightyClaude-windows-${{ matrix.architecture }}-setup.exe -Version (Get-Content VERSION -Raw).Trim()
      - name: Upload distributable
        uses: actions/upload-artifact@v4
        with:
          name: MightyClaude-native-windows-${{ matrix.architecture }}
          path: |
            release/MightyClaude-windows-${{ matrix.architecture }}.zip
            release/MightyClaude-windows-${{ matrix.architecture }}.zip.sha256
            release/MightyClaude-windows-${{ matrix.architecture }}-setup.exe
            release/MightyClaude-windows-${{ matrix.architecture }}-setup.exe.sha256
          if-no-files-found: error
      - name: Upload isolated GUI result and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MightyClaude-windows-${{ matrix.architecture }}-smoke
          # WebView2 can still retire cache files after a failed app exits.
          # Publish the durable evidence only, not its mutable browser profile.
          path: |
            ${{ runner.temp }}/mighty-windows-smoke-${{ matrix.architecture }}/smoke*.png
            ${{ runner.temp }}/mighty-windows-smoke-${{ matrix.architecture }}/smoke-result.json
            ${{ runner.temp }}/mighty-windows-smoke-${{ matrix.architecture }}/*.log
            ${{ runner.temp }}/mighty-windows-smoke-${{ matrix.architecture }}/native-crash-events*.json
            ${{ runner.temp }}/mighty-windows-smoke-${{ matrix.architecture }}/native-crash-events-error.txt
            ${{ runner.temp }}/mighty-windows-smoke-${{ matrix.architecture }}/native-process.json
            ${{ runner.temp }}/mighty-windows-smoke-${{ matrix.architecture }}/published-files.json
          if-no-files-found: warn
      - name: Upload the web shell smoke result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MightyClaude-windows-${{ matrix.architecture }}-web-smoke
          path: |
            ${{ runner.temp }}/mighty-windows-web-smoke-${{ matrix.architecture }}/smoke-result.json
            ${{ runner.temp }}/mighty-windows-web-smoke-${{ matrix.architecture }}/*.log
            ${{ runner.temp }}/mighty-windows-web-smoke-${{ matrix.architecture }}/native-crash-events*.json
            ${{ runner.temp }}/mighty-windows-web-smoke-${{ matrix.architecture }}/native-process.json
          if-no-files-found: warn
