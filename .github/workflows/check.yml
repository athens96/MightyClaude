name: Check desktop foundation
on:
  push:
  pull_request:
jobs:
  check:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run package:dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
