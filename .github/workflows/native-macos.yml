name: Native clients — macOS
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Build, test and capture the help screenshots (release.py dispatches this when a build commit's push run skipped the Mac)
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  changes:
    # Whether this run builds and tests the Mac app, and whether it captures the help screenshots
    # (release commits and full dispatches only): scripts/ci-changes.sh.
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
      help: ${{ steps.decide.outputs.help }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          MESSAGE: ${{ github.event.head_commit.message }}
          FULL: ${{ inputs.full }}
        run: bash scripts/ci-changes.sh macos

  macos-tests:
    # The Swift core tests and the mod's checks, on their own runner beside the build job.
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Report the selected Apple toolchain
        run: |
          xcode-select -p
          xcrun --find swift
          xcrun swift --version
      - name: Restore SwiftPM downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            native/macos/.build/repositories
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/macos/Package.resolved', 'native/macos/Vendor/libghostty-spm/Package.swift') }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mods/mighty-bridge/tests/package-lock.json
      - name: Design-token gate — colour and spacing literals only go down
        run: node scripts/check-design-tokens.js --check
      - name: Type-check and test the Claude mod
        working-directory: mods/mighty-bridge/tests
        run: npm ci --no-audit --no-fund && npm run check
      - name: Test Swift core
        env:
          # Scenarios S1 and S2 leave their records here for the record script.
          MIGHTY_DELEGATION_RECORD_EXPORT: ${{ runner.temp }}/delegation-records
        run: bash scripts/test-native-macos.sh
      - name: Remote workspaces — host and client talk over loopback
        # One app shares a workspace on loopback (injected in code, as only tests
        # may) and another connects to it, runs a command and a scripted Claude
        # turn there, answers its tool request, and is refused a wrong key, an
        # oversize body, an unshared folder and a redirect; the remote mirror's
        # routes show and drive only shared panes. The step above runs these too;
        # this one names them, and runs even when an unrelated test failed.
        if: success() || failure()
        run: bash scripts/test-native-macos.sh --filter '\.Remote(Workspace|Mirror)[A-Za-z]*Tests/'
      - name: Delegation record script judges its fixtures and the S1 and S2 records
        # Read-only: passed on the S1-like and S2-like fixtures and on both
        # exported scenario records, failed or invalid on the broken fixtures.
        if: success() || failure()
        run: |
          python3 scripts/test_delegation_record.py -v
          status=0
          for record in s1 s2; do
            folder="$RUNNER_TEMP/delegation-records/$record"
            echo "::group::Delegation record $record"
            python3 scripts/delegation-record.py --profile "$folder/profile" --repo "$folder/repo" --claude-dir "$folder/claude" || status=1
            echo "::endgroup::"
          done
          exit $status

  macos:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The build number is the commit count, so the whole history is fetched.
          fetch-depth: 0
      - name: Report the selected Apple toolchain
        run: |
          xcode-select -p
          xcrun --find swift
          xcrun swift --version
          xcrun --sdk macosx --show-sdk-path
      - name: Restore SwiftPM downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            native/macos/.build/repositories
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/macos/Package.resolved', 'native/macos/Vendor/libghostty-spm/Package.swift') }}
      # A push to main builds the package a release ships, so it carries the pinned browser engine
      # (CEF and Node, BrowserEngine.lock) as the Mac release zips always have; other runs build without it.
      - name: Restore the pinned browser engine (main)
        # Like the build step below, also after a failed test step, so the build never lacks the engine.
        if: (success() || failure()) && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/MightyCode/browser-engine
          key: browser-engine-${{ hashFiles('native/macos/BrowserEngine.lock') }}
      - name: Fetch the pinned browser engine (main)
        # Like the build step below, also after a failed test step, so the build never lacks the engine.
        if: (success() || failure()) && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: bash scripts/fetch-browser-engine.sh
      - name: Build SwiftUI application
        id: build-app
        # Runs even when the Swift tests failed, so one CI run reports both.
        if: success() || failure()
        env:
          # The update channel's address and public key, as native-windows.yml stamps them; repository variables override.
          MIGHTY_UPDATE_URL: ${{ vars.MIGHTY_UPDATE_URL || 'https://pub-b705901d18c940159d40f58683d758ad.r2.dev/mightycode/latest.json' }}
          MIGHTY_UPDATE_PUBLIC_KEY: ${{ vars.MIGHTY_UPDATE_PUBLIC_KEY || 'C02DD3qWG+A5gJdYwpaEnvpzYugo354CLtUtU+oXmZ4=' }}
          MIGHTY_BROWSER_ENGINE: ${{ (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') && '1' || '' }}
        run: bash scripts/build-macos.sh
      - name: Delegation server lists its six tools headlessly; mighty-terminal keeps its four tools
        # The app binary as the two stdio MCP servers a run can launch. Only a Claude
        # pane's run with the hidden delegation switch on names the second one.
        if: (success() || failure()) && steps.build-app.outcome == 'success'
        timeout-minutes: 2
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          app = "release/native-macos/MightyCode.app/Contents/MacOS/MightyCode"
          env = {k: v for k, v in os.environ.items() if not k.startswith("MIGHTY_")}
          requests = [
              {"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {"protocolVersion": "2025-06-18"}},
              {"jsonrpc": "2.0", "id": 2, "method": "tools/list"},
          ]
          def ask(mode):
              run = subprocess.run([app, mode], input="".join(json.dumps(r) + "\n" for r in requests),
                                   capture_output=True, text=True, timeout=60, env=env)
              answers = {a.get("id"): a.get("result", {}) for a in map(json.loads, filter(None, run.stdout.splitlines()))}
              return run.returncode, answers.get(1, {}).get("serverInfo", {}).get("name"), [t.get("name") for t in answers.get(2, {}).get("tools", [])]
          terminal = ask("--agent-io-mcp")
          delegation = ask("--agent-delegation-mcp")
          print(json.dumps({"terminal": terminal, "delegation": delegation}))
          four = ["run_in_terminal", "read_latest_output", "stop", "open_url"]
          six = ["delegate", "list_children", "child_status", "merge", "follow_up", "discard"]
          problems = []
          if terminal != (0, "mighty-terminal", four):
              problems.append(f"--agent-io-mcp answered {terminal}")
          if delegation != (0, "mighty-delegation", six):
              problems.append(f"--agent-delegation-mcp answered {delegation}")
          for problem in problems:
              print(f"::error title=macOS MCP servers::{problem}", flush=True)
          sys.exit(1 if problems else 0)
          PY
      - name: Smoke test isolated native profile
        if: success() || failure()
        timeout-minutes: 3
        run: release/native-macos/MightyCode.app/Contents/MacOS/MightyCode --smoke-test --smoke-exit --profile "$RUNNER_TEMP/mighty-native-smoke"
      - name: Check smoke result
        if: success() || failure()
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys
          profile = pathlib.Path(os.environ["RUNNER_TEMP"]) / "mighty-native-smoke"
          result = json.loads((profile / "smoke-result.json").read_text())
          print(result)
          tree = profile / "composer-accessibility.json"
          if not result["passed"]:
              if tree.exists():
                  print("Composer accessibility diagnostics:")
                  print(tree.read_text())
              error = str(result.get("error", "unknown"))
              exc_type = str(result.get("exceptionType", result.get("exception_type", "")))
              passed = result.get("checks", result.get("passedChecks", result.get("passed_checks", [])))
              if isinstance(passed, list):
                  passed_str = ", ".join(str(c) for c in passed)
              else:
                  passed_str = str(passed)
              msg = f"error={error}; exceptionType={exc_type}; passed=[{passed_str}]"
              msg_enc = msg.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')[:1500]
              print(f'::error title=macOS GUI smoke::{msg_enc}', flush=True)
              # The job log needs a login; annotations are public. Put the smoke's own
              # diagnostics and a summary of the accessibility tree there too.
              def notice(title, text):
                  enc = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  for i in range(0, min(len(enc), 6000), 1400):
                      print(f'::notice title={title} ({i // 1400 + 1})::{enc[i:i + 1400]}', flush=True)
              notice('macOS GUI smoke result', json.dumps({k: v for k, v in result.items() if k not in ('passed',)}, ensure_ascii=False, sort_keys=True))
              if tree.exists():
                  nodes = json.loads(tree.read_text())
                  ids = sorted({n.get('id') for n in nodes if n.get('id')})
                  classes = {}
                  for n in nodes: classes[n.get('class')] = classes.get(n.get('class'), 0) + 1
                  top = sorted(classes.items(), key=lambda kv: -kv[1])[:25]
                  notice('macOS GUI smoke accessibility', json.dumps({'nodes': len(nodes), 'maxDepth': max((n.get('depth', 0) for n in nodes), default=0), 'ids': ids[:120], 'classes': top}, ensure_ascii=False))
              sys.exit(1)
          PY
      - name: Upload isolated macOS GUI result and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MightyCode-macos-smoke
          path: ${{ runner.temp }}/mighty-native-smoke/
          if-no-files-found: warn
      - name: Smoke test the Ghostty terminal pane
        # A real shell in a disposable profile: PTY, folder, history, Ctrl-C, resize,
        # restart, and that the pane is running only while a command runs. Only with an app to run.
        if: (success() || failure()) && steps.build-app.outcome == 'success'
        timeout-minutes: 5
        run: |
          set -u
          profile="$RUNNER_TEMP/mighty-terminal-smoke"
          rm -rf "$profile"
          status=0
          if ! perl -e 'alarm shift; exec @ARGV' 180 release/native-macos/MightyCode.app/Contents/MacOS/MightyCode \
              --terminal-smoke-test --smoke-exit --profile "$profile"; then
            echo "::error title=macOS terminal smoke::the app exited non-zero or timed out"
            status=1
          fi
          python3 - <<'PY' || status=1
          import json, os, pathlib, sys
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "mighty-terminal-smoke" / "terminal-smoke-result.json"
          if not path.exists():
              print("::error title=macOS terminal smoke::no terminal-smoke-result.json was written", flush=True)
              sys.exit(1)
          result = json.loads(path.read_text())
          summary = {k: v for k, v in result.items() if k not in ("transcript", "failureTranscript")}
          print(json.dumps(summary, ensure_ascii=False, sort_keys=True, indent=2))
          if not result.get("passed"):
              msg = f'stage={result.get("failedStage", "?")}; error={result.get("error", "unknown")}'
              print(f'::error title=macOS terminal smoke::{msg.replace("%", "%25").replace(chr(13), "%0D").replace(chr(10), "%0A")[:1500]}', flush=True)
              sys.exit(1)
          PY
          exit $status
      - name: Upload terminal smoke result and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MightyCode-macos-terminal-smoke
          path: ${{ runner.temp }}/mighty-terminal-smoke/
          if-no-files-found: warn
      - name: Smoke test the Mighty diagram
        # The diagram in a disposable profile: block layout, resize, the 실행 split, and
        # the follow camera (the newest block sits just above the composer; a reader who
        # scrolled up is never pulled back when a new block appears). Only with an app to run.
        if: (success() || failure()) && steps.build-app.outcome == 'success'
        timeout-minutes: 5
        run: |
          set -u
          profile="$RUNNER_TEMP/mighty-graph-smoke"
          rm -rf "$profile"
          status=0
          if ! perl -e 'alarm shift; exec @ARGV' 180 release/native-macos/MightyCode.app/Contents/MacOS/MightyCode \
              --graph-smoke-test --smoke-exit --profile "$profile"; then
            echo "::error title=macOS graph smoke::the app exited non-zero or timed out"
            status=1
          fi
          python3 - <<'PY' || status=1
          import json, os, pathlib, sys
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "mighty-graph-smoke" / "graph-smoke-result.json"
          if not path.exists():
              print("::error title=macOS graph smoke::no graph-smoke-result.json was written", flush=True)
              sys.exit(1)
          result = json.loads(path.read_text())
          print(json.dumps(result, ensure_ascii=False, sort_keys=True, indent=2)[:20000])
          if not result.get("passed"):
              failed = [k for k, v in result.items() if v is False or (isinstance(v, dict) and v.get("passed") is False)]
              msg = f'failed={failed}; error={result.get("error", "")}'
              print(f'::error title=macOS graph smoke::{msg.replace("%", "%25").replace(chr(13), "%0D").replace(chr(10), "%0A")[:1500]}', flush=True)
              sys.exit(1)
          PY
          exit $status
      - name: Upload graph smoke result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MightyCode-macos-graph-smoke
          path: ${{ runner.temp }}/mighty-graph-smoke/
          if-no-files-found: warn
      - name: Smoke test the setup screen
        # The first-run setup sheet over fixed probe results in a disposable profile (nothing
        # on the runner is probed or installed): its rows and states, the out-of-date Claude's
        # update, Tailscale's download page, a picked tool pulling in Homebrew, and the
        # confirmation's commands in order. The confirmation is cancelled; no script is written.
        if: (success() || failure()) && steps.build-app.outcome == 'success'
        timeout-minutes: 5
        run: |
          set -u
          profile="$RUNNER_TEMP/mighty-setup-smoke"
          rm -rf "$profile"
          status=0
          if ! perl -e 'alarm shift; exec @ARGV' 180 release/native-macos/MightyCode.app/Contents/MacOS/MightyCode \
              --setup-smoke-test --smoke-exit --profile "$profile"; then
            echo "::error title=macOS setup smoke::the app exited non-zero or timed out"
            status=1
          fi
          python3 - <<'PY' || status=1
          import json, os, pathlib, sys
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "mighty-setup-smoke" / "setup-smoke-result.json"
          if not path.exists():
              print("::error title=macOS setup smoke::no setup-smoke-result.json was written", flush=True)
              sys.exit(1)
          result = json.loads(path.read_text())
          print(json.dumps(result, ensure_ascii=False, sort_keys=True, indent=2)[:20000])
          if not result.get("passed") or result.get("installRan"):
              msg = f'error={result.get("error", "")}'
              print(f'::error title=macOS setup smoke::{msg.replace("%", "%25").replace(chr(13), "%0D").replace(chr(10), "%0A")[:1500]}', flush=True)
              sys.exit(1)
          PY
          exit $status
      - name: Upload setup smoke result and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MightyCode-macos-setup-smoke
          path: ${{ runner.temp }}/mighty-setup-smoke/
          if-no-files-found: warn
      - name: Smoke test the work map
        # The work map over a git repository of three commits and a tag in a disposable profile,
        # with a saved summary standing in for the AI's answer: the pane opens as one tab, shows
        # the versions and topic cards, and is left out of the phone's pane list. No AI request is sent.
        if: (success() || failure()) && steps.build-app.outcome == 'success'
        timeout-minutes: 5
        run: |
          set -u
          profile="$RUNNER_TEMP/mighty-workmap-smoke"
          rm -rf "$profile"
          status=0
          if ! perl -e 'alarm shift; exec @ARGV' 180 release/native-macos/MightyCode.app/Contents/MacOS/MightyCode \
              --workmap-smoke-test --smoke-exit --profile "$profile"; then
            echo "::error title=macOS work map smoke::the app exited non-zero or timed out"
            status=1
          fi
          python3 - <<'PY' || status=1
          import json, os, pathlib, sys
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "mighty-workmap-smoke" / "workmap-smoke-result.json"
          if not path.exists():
              print("::error title=macOS work map smoke::no workmap-smoke-result.json was written", flush=True)
              sys.exit(1)
          result = json.loads(path.read_text())
          print(json.dumps(result, ensure_ascii=False, sort_keys=True, indent=2)[:20000])
          if not result.get("passed") or result.get("aiRequestSent"):
              msg = f'error={result.get("error", "")}'
              print(f'::error title=macOS work map smoke::{msg.replace("%", "%25").replace(chr(13), "%0D").replace(chr(10), "%0A")[:1500]}', flush=True)
              sys.exit(1)
          PY
          exit $status
      - name: Upload work map smoke result and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MightyCode-macos-workmap-smoke
          path: ${{ runner.temp }}/mighty-workmap-smoke/
          if-no-files-found: warn
      - name: Smoke test delegation close paths
        # Through the store's actions and the phone's routes, in a disposable profile and
        # repository: merged children closed on the Mac and from the phone are cleaned up,
        # a phone send releases a held notice, a workspace with children is refused with
        # workspace_has_children, and a parent's close asks first on the Mac and closes only
        # the parent from the phone, and the store's send for another agent (what a worktree menu
        # pick calls; the menu itself is not shown) starts a Claude child of a Codex pane. Every
        # Claude run is the scripted FakeClaude the app
        # build made beside the app's binary; no model runs. Only with an app to run.
        if: (success() || failure()) && steps.build-app.outcome == 'success'
        timeout-minutes: 5
        run: |
          set -u
          profile="$RUNNER_TEMP/mighty-delegation-smoke"
          rm -rf "$profile"
          status=0
          fake="$(find native/macos/.build -type f -perm -u+x -name FakeClaude -not -path '*.dSYM/*' | head -n 1)"
          if [ -z "$fake" ]; then
            swift build --package-path native/macos --product FakeClaude
            fake="$(swift build --package-path native/macos --show-bin-path)/FakeClaude"
          fi
          case "$fake" in /*) ;; *) fake="$PWD/$fake" ;; esac
          echo "FakeClaude: $fake"
          if ! perl -e 'alarm shift; exec @ARGV' 240 release/native-macos/MightyCode.app/Contents/MacOS/MightyCode \
              --delegation-smoke-test --smoke-exit --profile "$profile" --fake-claude "$fake"; then
            echo "::error title=macOS delegation smoke::the app exited non-zero or timed out"
            status=1
          fi
          python3 - <<'PY' || status=1
          import json, os, pathlib, sys
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "mighty-delegation-smoke" / "delegation-smoke-result.json"
          if not path.exists():
              print("::error title=macOS delegation smoke::no delegation-smoke-result.json was written", flush=True)
              sys.exit(1)
          result = json.loads(path.read_text())
          print(json.dumps(result, ensure_ascii=False, sort_keys=True, indent=2))
          expected = ["childrenListed", "macCloseMergedChild", "phoneCloseMergedChild", "phoneSendReleasedHeldNotice",
                      "removeRefusedOpenChild", "macParentCloseAsks", "phoneParentCloseKeepsChild", "removeRefusedKeptWorktree", "removedAfterDiscard",
                      "otherAgentChildStarted"]
          missing = [name for name in expected if name not in result.get("checks", {})]
          if not result.get("passed") or missing:
              msg = f'stage={result.get("failedStage", "?")}; error={result.get("error", "unknown")}; missing={missing}'
              print(f'::error title=macOS delegation smoke::{msg.replace("%", "%25").replace(chr(13), "%0D").replace(chr(10), "%0A")[:1500]}', flush=True)
              sys.exit(1)
          PY
          exit $status
      - name: Upload delegation smoke result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MightyCode-macos-delegation-smoke
          path: ${{ runner.temp }}/mighty-delegation-smoke/delegation-smoke-result.json
          if-no-files-found: warn
      - name: Capture help screenshots in four languages
        # The help site's pictures (docs/help/shots.json) from the bundled demo profile,
        # one launch per language in a fresh profile, light and dark. Never run on a
        # developer's Mac: a second app instance breaks Korean input there. Only release
        # commits and full dispatches take them (ten minutes; the help site is uploaded
        # from a release's pictures).
        if: (success() || failure()) && needs.changes.outputs.help == 'true'
        timeout-minutes: 30
        run: |
          set -u
          APP=release/native-macos/MightyCode.app/Contents/MacOS/MightyCode
          status=0
          for lang in ko en zh ja; do
            case "$lang" in zh) tag=zh-Hans ;; *) tag="$lang" ;; esac
            profile="$RUNNER_TEMP/mighty-help-$lang"
            rm -rf "$profile"
            # The demo folders go in the runner's throwaway home, so the pictures show
            # ~/Projects/my-app rather than the runner's temp folder.
            echo "::group::Help capture ($lang)"
            # perl's alarm bounds one launch, so a stuck language cannot use up the step.
            if ! perl -e 'alarm shift; exec @ARGV' 420 "$APP" --help-capture --smoke-exit --profile "$profile" \
                --help-workspaces "$HOME/Projects" -language "$lang" -AppleLanguages "($tag)"; then
              echo "::error title=Help capture ($lang)::the app exited non-zero or timed out"
              status=1
            fi
            echo "::endgroup::"
          done
          python3 - <<'PY' || status=1
          import json, os, pathlib, sys
          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          shots = json.loads(pathlib.Path("docs/help/shots.json").read_text())["shots"]
          expected = {f'{s["id"]}-{t}.png' for s in shots for t in s.get("themes", ["light", "dark"])}
          bad = False
          for lang in ["ko", "en", "zh", "ja"]:
              folder = temp / f"mighty-help-{lang}" / "help-shots" / lang
              manifest_path = folder / "manifest.json"
              if not manifest_path.exists():
                  print(f"::error title=Help capture ({lang})::no manifest.json was written", flush=True)
                  bad = True
                  continue
              manifest = json.loads(manifest_path.read_text())
              failed = [s for s in manifest.get("shots", []) if s.get("status") != "ok"]
              ok = {s["file"] for s in manifest.get("shots", []) if s.get("status") == "ok" and (folder / s["file"]).exists()}
              missing = sorted(expected - ok)
              print(f"{lang}: {len(ok)} of {len(expected)} pictures, {len(failed)} failed")
              if manifest.get("error"):
                  print(f'::error title=Help capture ({lang})::{manifest["error"]}', flush=True)
              for shot in failed:
                  print(f'::error title=Help shot {lang}/{shot.get("file")}::{shot.get("error", "failed")}', flush=True)
              if not manifest.get("passed") or failed or missing:
                  if missing and not failed:
                      print(f'::error title=Help capture ({lang})::missing {", ".join(missing[:20])}', flush=True)
                  bad = True
          sys.exit(1 if bad else 0)
          PY
          exit $status
      - name: Upload help screenshots
        if: always() && needs.changes.outputs.help == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MightyCode-macos-help-shots
          path: ${{ runner.temp }}/mighty-help-*/help-shots/
          if-no-files-found: warn
      - name: Package macOS app with executable modes and hidden resources
        run: ditto -c -k --sequesterRsrc --keepParent release/native-macos/MightyCode.app release/MightyCode-macos.zip
      - name: Gate the release package size before upload
        run: scripts/check-release-size.sh release/MightyCode-macos.zip
      # Without notarization (any branch, or main before the repository variable
      # MIGHTY_MAC_NOTARIZE is 1) this ad-hoc zip is the release package. With it,
      # the zip goes to the notarize-macos job, which signs, notarizes and adds the dmg.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ (vars.MIGHTY_MAC_NOTARIZE == '1' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) && 'MightyCode-native-macos-unsigned' || 'MightyCode-native-macos' }}
          path: release/MightyCode-macos.zip
          if-no-files-found: error

  notarize-macos:
    # Developer ID signing and notarization for main pushes, so a downloaded app
    # opens without Gatekeeper's warning. The certificate and the notary key are
    # secrets of the `release` environment (main only); the build job above never
    # sees them. Actions are pinned to commit SHAs, as in release-manifest.yml.
    # A full dispatch on main (a release build from a commit whose push run skipped the Mac) is signed too.
    needs: [macos, macos-tests]
    if: vars.MIGHTY_MAC_NOTARIZE == '1' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: MightyCode-native-macos-unsigned
          path: ${{ runner.temp }}/unsigned
      - name: Unpack the built app
        run: ditto -x -k "$RUNNER_TEMP/unsigned/MightyCode-macos.zip" "$RUNNER_TEMP/app"
      - name: Put the Developer ID certificate in a temporary keychain
        env:
          P12_BASE64: ${{ secrets.MIGHTY_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.MIGHTY_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$P12_BASE64" && test -n "$P12_PASSWORD"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)"
          test -n "$identity"
          echo "MIGHTY_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Write the notary API key
        env:
          NOTARY_KEY: ${{ secrets.MIGHTY_NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$NOTARY_KEY"
          printf '%s\n' "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
          echo "MIGHTY_NOTARY_KEY_FILE=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
      - name: Install dmgbuild (hash-pinned) for the dmg's install window
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/python" -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --no-deps -r scripts/dmg/requirements.txt
          echo "DMGBUILD=$RUNNER_TEMP/dmgbuild/bin/dmgbuild" >> "$GITHUB_ENV"
      - name: Sign, notarize and staple the app; build the dmg
        env:
          MIGHTY_NOTARY_KEY_ID: ${{ secrets.MIGHTY_NOTARY_KEY_ID }}
          MIGHTY_NOTARY_ISSUER_ID: ${{ secrets.MIGHTY_NOTARY_ISSUER_ID }}
        run: scripts/notarize-macos.sh "$RUNNER_TEMP/app/MightyCode.app" release
      - name: Gate the release package sizes before upload
        run: |
          scripts/check-release-size.sh release/MightyCode-macos.zip
          scripts/check-release-size.sh release/MightyCode-macos.dmg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: MightyCode-native-macos
          path: |
            release/MightyCode-macos.zip
            release/MightyCode-macos.dmg
          if-no-files-found: error
      - name: Remove the keychain and the key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8"
