name: Native clients — macOS
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The build number is the commit count, so the whole history is fetched.
          fetch-depth: 0
      - name: Report the selected Apple toolchain
        run: |
          xcode-select -p
          xcrun --find swift
          xcrun swift --version
          xcrun --sdk macosx --show-sdk-path
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mods/mighty-bridge/tests/package-lock.json
      - name: Type-check and test the Claude mod
        working-directory: mods/mighty-bridge/tests
        run: npm ci --no-audit --no-fund && npm run check
      - name: Test Swift core
        run: bash scripts/test-native-macos.sh
      - name: Build SwiftUI application
        # Runs even when the Swift tests failed, so one CI run reports both.
        if: success() || failure()
        env:
          MIGHTY_UPDATE_URL: ${{ vars.MIGHTY_UPDATE_URL }}
          MIGHTY_UPDATE_PUBLIC_KEY: ${{ vars.MIGHTY_UPDATE_PUBLIC_KEY }}
        run: bash scripts/build-macos.sh
      - name: Smoke test isolated native profile
        if: success() || failure()
        timeout-minutes: 3
        run: release/native-macos/MightyClaude.app/Contents/MacOS/MightyClaude --smoke-test --smoke-exit --profile "$RUNNER_TEMP/mighty-native-smoke"
      - name: Check smoke result
        if: success() || failure()
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys
          profile = pathlib.Path(os.environ["RUNNER_TEMP"]) / "mighty-native-smoke"
          result = json.loads((profile / "smoke-result.json").read_text())
          print(result)
          tree = profile / "composer-accessibility.json"
          if not result["passed"]:
              if tree.exists():
                  print("Composer accessibility diagnostics:")
                  print(tree.read_text())
              error = str(result.get("error", "unknown"))
              exc_type = str(result.get("exceptionType", result.get("exception_type", "")))
              passed = result.get("checks", result.get("passedChecks", result.get("passed_checks", [])))
              if isinstance(passed, list):
                  passed_str = ", ".join(str(c) for c in passed)
              else:
                  passed_str = str(passed)
              msg = f"error={error}; exceptionType={exc_type}; passed=[{passed_str}]"
              msg_enc = msg.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')[:1500]
              print(f'::error title=macOS GUI smoke::{msg_enc}', flush=True)
              # The job log needs a login; annotations are public. Put the smoke's own
              # diagnostics and a summary of the accessibility tree there too.
              def notice(title, text):
                  enc = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  for i in range(0, min(len(enc), 6000), 1400):
                      print(f'::notice title={title} ({i // 1400 + 1})::{enc[i:i + 1400]}', flush=True)
              notice('macOS GUI smoke result', json.dumps({k: v for k, v in result.items() if k not in ('passed',)}, ensure_ascii=False, sort_keys=True))
              if tree.exists():
                  nodes = json.loads(tree.read_text())
                  ids = sorted({n.get('id') for n in nodes if n.get('id')})
                  classes = {}
                  for n in nodes: classes[n.get('class')] = classes.get(n.get('class'), 0) + 1
                  top = sorted(classes.items(), key=lambda kv: -kv[1])[:25]
                  notice('macOS GUI smoke accessibility', json.dumps({'nodes': len(nodes), 'maxDepth': max((n.get('depth', 0) for n in nodes), default=0), 'ids': ids[:120], 'classes': top}, ensure_ascii=False))
              sys.exit(1)
          PY
      - name: Upload isolated macOS GUI result and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MightyClaude-macos-smoke
          path: ${{ runner.temp }}/mighty-native-smoke/
          if-no-files-found: warn
      - name: Capture help screenshots in four languages
        # The help site's pictures (docs/help/shots.json) from the bundled demo profile,
        # one launch per language in a fresh profile, light and dark. Never run on a
        # developer's Mac: a second app instance breaks Korean input there.
        if: success() || failure()
        timeout-minutes: 30
        run: |
          set -u
          APP=release/native-macos/MightyClaude.app/Contents/MacOS/MightyClaude
          status=0
          for lang in ko en zh ja; do
            case "$lang" in zh) tag=zh-Hans ;; *) tag="$lang" ;; esac
            profile="$RUNNER_TEMP/mighty-help-$lang"
            rm -rf "$profile"
            # The demo folders go in the runner's throwaway home, so the pictures show
            # ~/Projects/my-app rather than the runner's temp folder.
            echo "::group::Help capture ($lang)"
            # perl's alarm bounds one launch, so a stuck language cannot use up the step.
            if ! perl -e 'alarm shift; exec @ARGV' 420 "$APP" --help-capture --smoke-exit --profile "$profile" \
                --help-workspaces "$HOME/Projects" -language "$lang" -AppleLanguages "($tag)"; then
              echo "::error title=Help capture ($lang)::the app exited non-zero or timed out"
              status=1
            fi
            echo "::endgroup::"
          done
          python3 - <<'PY' || status=1
          import json, os, pathlib, sys
          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          shots = json.loads(pathlib.Path("docs/help/shots.json").read_text())["shots"]
          expected = {f'{s["id"]}-{t}.png' for s in shots for t in s.get("themes", ["light", "dark"])}
          bad = False
          for lang in ["ko", "en", "zh", "ja"]:
              folder = temp / f"mighty-help-{lang}" / "help-shots" / lang
              manifest_path = folder / "manifest.json"
              if not manifest_path.exists():
                  print(f"::error title=Help capture ({lang})::no manifest.json was written", flush=True)
                  bad = True
                  continue
              manifest = json.loads(manifest_path.read_text())
              failed = [s for s in manifest.get("shots", []) if s.get("status") != "ok"]
              ok = {s["file"] for s in manifest.get("shots", []) if s.get("status") == "ok" and (folder / s["file"]).exists()}
              missing = sorted(expected - ok)
              print(f"{lang}: {len(ok)} of {len(expected)} pictures, {len(failed)} failed")
              if manifest.get("error"):
                  print(f'::error title=Help capture ({lang})::{manifest["error"]}', flush=True)
              for shot in failed:
                  print(f'::error title=Help shot {lang}/{shot.get("file")}::{shot.get("error", "failed")}', flush=True)
              if not manifest.get("passed") or failed or missing:
                  if missing and not failed:
                      print(f'::error title=Help capture ({lang})::missing {", ".join(missing[:20])}', flush=True)
                  bad = True
          sys.exit(1 if bad else 0)
          PY
          exit $status
      - name: Upload help screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MightyClaude-macos-help-shots
          path: ${{ runner.temp }}/mighty-help-*/help-shots/
          if-no-files-found: warn
      - name: Package macOS app with executable modes and hidden resources
        run: ditto -c -k --sequesterRsrc --keepParent release/native-macos/MightyClaude.app release/MightyClaude-macos.zip
      - name: Gate the release package size before upload
        run: scripts/check-release-size.sh release/MightyClaude-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MightyClaude-native-macos
          path: release/MightyClaude-macos.zip
          if-no-files-found: error

  sign-manifest:
    needs: macos
    runs-on: macos-latest
    if: vars.MIGHTY_DOWNLOAD_BASE != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MightyClaude-native-macos
          path: release/
      - name: Write the signed update manifest for the package
        env:
          MIGHTY_DOWNLOAD_BASE: ${{ vars.MIGHTY_DOWNLOAD_BASE }}
          MIGHTY_UPDATE_SIGNING_KEY: ${{ secrets.MIGHTY_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          KEY_ARGS=()
          if [ -n "${MIGHTY_UPDATE_SIGNING_KEY:-}" ]; then
            printf '%s' "$MIGHTY_UPDATE_SIGNING_KEY" > "$RUNNER_TEMP/update-signing.key"
            KEY_ARGS=(--sign-key "$RUNNER_TEMP/update-signing.key")
          fi
          python3 scripts/make-update-manifest.py --macos release/MightyClaude-macos.zip --base-url "$MIGHTY_DOWNLOAD_BASE/$VERSION" --out release/latest.json "${KEY_ARGS[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: MightyClaude-signed-manifest
          path: |
            release/latest.json
            release/latest.unsigned.json
          if-no-files-found: warn
