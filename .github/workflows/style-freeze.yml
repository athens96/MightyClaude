name: Style engine freeze
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The check reads the tag and the history behind it.
          fetch-depth: 0
      - name: The frozen style engine is unchanged since the tag
        run: |
          set -euo pipefail
          if ! git rev-parse -q --verify refs/tags/mighty-style-engine-v7 >/dev/null; then
            # v7 deletes bundled manifests and goldens, which a pending freeze on
            # v6 may not do (it lets new files in, nothing out), so there is no
            # fallback: the engine commit, the FREEZE commit and the tag go up in
            # one atomic push, and until the tag exists the check fails closed.
            echo "mighty-style-engine-v7 태그가 없습니다. 엔진 커밋·FREEZE 커밋·태그를 한 번에(--atomic) 올리세요."
          fi
          bash scripts/check-style-freeze.sh
