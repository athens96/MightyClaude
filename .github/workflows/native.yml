name: Native clients
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report the selected Apple toolchain
        run: |
          xcode-select -p
          xcrun --find swift
          xcrun swift --version
          xcrun --sdk macosx --show-sdk-path
      - name: Test Swift core and loopback remote execution
        run: bash scripts/test-native-macos.sh
      - name: Build SwiftUI application
        run: bash scripts/build-macos.sh
      - name: Smoke test isolated native profile
        timeout-minutes: 3
        run: release/native-macos/MightyClaude.app/Contents/MacOS/MightyClaude --smoke-test --smoke-exit --profile "$RUNNER_TEMP/mighty-native-smoke"
      - name: Check smoke result
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          profile = pathlib.Path(os.environ["RUNNER_TEMP"]) / "mighty-native-smoke"
          result = json.loads((profile / "smoke-result.json").read_text())
          print(result)
          tree = profile / "composer-accessibility.json"
          if not result["passed"] and tree.exists():
              print("Composer accessibility diagnostics:")
              print(tree.read_text())
          assert result["passed"]
          PY
      - name: Upload isolated macOS GUI result and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MightyClaude-macos-smoke
          path: ${{ runner.temp }}/mighty-native-smoke/
          if-no-files-found: warn
      - name: Package macOS app with executable modes and hidden resources
        run: ditto -c -k --sequesterRsrc --keepParent release/native-macos/MightyClaude.app release/MightyClaude-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MightyClaude-native-macos
          path: release/MightyClaude-macos.zip
          if-no-files-found: error
  windows:
    name: Windows ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-2025
          - architecture: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test core and publish self-contained WinUI folder and ZIP
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Architecture ${{ matrix.architecture }} -Configuration Release
      - name: Launch native WinUI with an isolated profile and capture GUI evidence
        shell: pwsh
        timeout-minutes: 4
        run: ./scripts/test-native-windows.ps1 -Executable ./release/native-windows-${{ matrix.architecture }}/MightyClaude.exe -ProfileDirectory "$env:RUNNER_TEMP/mighty-windows-smoke-${{ matrix.architecture }}"
      - name: Upload distributable
        uses: actions/upload-artifact@v4
        with:
          name: MightyClaude-native-windows-${{ matrix.architecture }}
          path: |
            release/MightyClaude-windows-${{ matrix.architecture }}.zip
            release/MightyClaude-windows-${{ matrix.architecture }}.zip.sha256
          if-no-files-found: error
      - name: Upload isolated GUI result and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MightyClaude-windows-${{ matrix.architecture }}-smoke
          path: ${{ runner.temp }}/mighty-windows-smoke-${{ matrix.architecture }}/
          if-no-files-found: warn
